spring:
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: b7ac73001@smtp-brevo.com
    password: ${brevo.api-key}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  app:
    mail:
      from: ${app.mail.from}       # your verified sender, e.g. noreply@yourdomain.com
      from-name: ${app.mail.from-name}
  application:
    name: transaction-management

  datasource:
    url: jdbc:postgresql://localhost:5432/transaction-management
    username: postgres
    password: Loriyagami1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway creates tables, Hibernate only checks them
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  file:
    name: logs/app.log
  level:
    root: INFO
    com.example.transactionmanagement: DEBUG
    org.hibernate.SQL: DEBUG
