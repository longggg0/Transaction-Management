spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: transaction-management

  mail:
    host: ${BREVO_SMTP_HOST}
    port: ${BREVO_SMTP_PORT}
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  mail:
    from: ${APP_MAIL_FROM}
    from-name: ${APP_MAIL_FROM_NAME}

server:
  port: 8080

logging:
  file:
    name: logs/app.log
  level:
    root: INFO
    com.example.transaction_management: DEBUG
    org.hibernate.SQL: DEBUG